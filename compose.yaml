{
  "services": {
    "bot": {
      "image": "coworking-nearby:local",
      "env_file": [
        ".env"
      ],
      "volumes": [
        {
          "type": "bind",
          "source": "./data",
          "target": "/app/data",
          "read_only": true
        }
      ],
      "stop_grace_period": "20s"
    }
  }
}
